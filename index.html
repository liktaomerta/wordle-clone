<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordle Clone</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="screen">
      <nav class="site-nav">
        <h1 class="site-heading">Wordle Clone</h1>
        <p class="site-description">
          Created by <span class="creator">Mert Karaca</span>
        </p>
        <div class="awaiting-response">
          <span class="emoji"> 😵‍💫 </span
          ><span class="no-move">Checking...</span>
        </div>
      </nav>
      <div class="boxes">
        <div class="first-row">
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
        </div>
        <div class="second-row">
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
        </div>
        <div class="third-row">
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
        </div>
        <div class="forth-row">
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
        </div>
        <div class="fifth-row">
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
        </div>
        <div class="sixth-row">
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
        </div>
      </div>
      <div class="keyboard-container">
        <div class="first-row-btns">
          <button class="btn">Q</button>
          <button class="btn">W</button>
          <button class="btn">E</button>
          <button class="btn">R</button>
          <button class="btn">T</button>
          <button class="btn">Y</button>
          <button class="btn">U</button>
          <button class="btn">I</button>
          <button class="btn">O</button>
          <button class="btn">P</button>
        </div>
        <div class="second-row-btn">
          <button class="btn">A</button>
          <button class="btn">S</button>
          <button class="btn">D</button>
          <button class="btn">F</button>
          <button class="btn">G</button>
          <button class="btn">H</button>
          <button class="btn">J</button>
          <button class="btn">K</button>
          <button class="btn">L</button>
        </div>
        <div class="third-row-btn">
          <button class="btn enter">ENTER</button>
          <button class="btn">Z</button>
          <button class="btn">X</button>
          <button class="btn">C</button>
          <button class="btn">V</button>
          <button class="btn">B</button>
          <button class="btn">N</button>
          <button class="btn">M</button>
          <button class="btn">BACK</button>
        </div>
      </div>
    </div>
  </body>
</html>
